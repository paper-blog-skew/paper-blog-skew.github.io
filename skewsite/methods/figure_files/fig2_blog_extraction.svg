<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">From the blog’s measurement expressions to metrics, relationships and paper counterparts</title><desc id="desc">Sentence one identifies current and power and states current to power. Sentence two identifies temperature and power and states temperature to power, an inverse relationship. Sentence three identifies charge without a relationship. Current, power, temperature and charge map by name to I, P, T and Q. The blog has four metrics, five mentions and two relationships.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17638B"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="25" y="35" font-size="24" font-weight="700" fill="#20252B" text-anchor="start">Measurement expressions in the three blog sentences</text><rect x="25" y="65" width="305" height="115" rx="8" fill="#EDF4F8" stroke="#17638B" stroke-width="1.5"/><text x="177.5" y="98" font-size="18" font-weight="700" fill="#20252B" text-anchor="middle">(1) “power … rises with …</text><text x="177.5" y="123" font-size="18" font-weight="700" fill="#20252B" text-anchor="middle">current”</text><text x="177.5" y="154" font-size="18" font-weight="400" fill="#707780" text-anchor="middle">Scaling construction</text><rect x="347" y="65" width="337" height="115" rx="8" fill="#EDF4F8" stroke="#17638B" stroke-width="1.5"/><text x="515.5" y="98" font-size="18" font-weight="700" fill="#20252B" text-anchor="middle">(2) “power … decreases as …</text><text x="515.5" y="123" font-size="18" font-weight="700" fill="#20252B" text-anchor="middle">temperature increases”</text><text x="515.5" y="154" font-size="18" font-weight="400" fill="#707780" text-anchor="middle">Scaling construction</text><rect x="701" y="65" width="274" height="115" rx="8" fill="#EDF4F8" stroke="#17638B" stroke-width="1.5"/><text x="838.0" y="104" font-size="18" font-weight="700" fill="#20252B" text-anchor="middle">(3) “how much charge”</text><text x="838.0" y="145" font-size="18" font-weight="400" fill="#707780" text-anchor="middle">Measurement head</text><path d="M177 180 C177 215 130 220 130 255" fill="none" stroke="#D1D7DD" stroke-width="2" stroke-linecap="round"/><path d="M177 180 C177 215 375 220 375 255" fill="none" stroke="#D1D7DD" stroke-width="2" stroke-linecap="round"/><path d="M515 180 C515 215 375 220 375 255" fill="none" stroke="#D1D7DD" stroke-width="2" stroke-linecap="round"/><path d="M515 180 C515 215 625 220 625 255" fill="none" stroke="#D1D7DD" stroke-width="2" stroke-linecap="round"/><path d="M838 180 C838 215 870 220 870 255" fill="none" stroke="#D1D7DD" stroke-width="2" stroke-linecap="round"/><text x="25" y="247" font-size="17" font-weight="700" fill="#20252B" text-anchor="start">BLOG</text><path d="M210 295H290" fill="none" stroke="#17638B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M545 295H460" fill="none" stroke="#17638B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="50" y="260" width="160" height="70" rx="8" fill="white" stroke="#20252B" stroke-width="1.5"/><text x="130" y="304" font-size="21" font-weight="700" fill="#20252B" text-anchor="middle">Current</text><path d="M130 330V403" fill="none" stroke="#707780" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="130" cy="435" r="27" fill="white" stroke="#20252B" stroke-width="2"/><text x="130" y="444" font-size="27" font-weight="700" fill="#20252B" text-anchor="middle">I</text><rect x="295" y="260" width="160" height="70" rx="8" fill="white" stroke="#20252B" stroke-width="1.5"/><text x="375" y="304" font-size="21" font-weight="700" fill="#20252B" text-anchor="middle">Power</text><path d="M375 330V403" fill="none" stroke="#707780" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="375" cy="435" r="27" fill="white" stroke="#20252B" stroke-width="2"/><text x="375" y="444" font-size="27" font-weight="700" fill="#20252B" text-anchor="middle">P</text><rect x="545" y="260" width="160" height="70" rx="8" fill="white" stroke="#20252B" stroke-width="1.5"/><text x="625" y="304" font-size="21" font-weight="700" fill="#20252B" text-anchor="middle">Temperature</text><path d="M625 330V403" fill="none" stroke="#707780" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="625" cy="435" r="27" fill="white" stroke="#20252B" stroke-width="2"/><text x="625" y="444" font-size="27" font-weight="700" fill="#20252B" text-anchor="middle">T</text><rect x="790" y="260" width="160" height="70" rx="8" fill="white" stroke="#20252B" stroke-width="1.5"/><text x="870" y="304" font-size="21" font-weight="700" fill="#20252B" text-anchor="middle">Charge</text><path d="M870 330V337 M870 370V403" fill="none" stroke="#707780" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="870" cy="435" r="27" fill="white" stroke="#20252B" stroke-width="2"/><text x="870" y="444" font-size="27" font-weight="700" fill="#20252B" text-anchor="middle">Q</text><text x="250" y="358" font-size="17" font-weight="400" fill="#17638B" text-anchor="middle">(1) rises with</text><text x="500" y="358" font-size="17" font-weight="400" fill="#17638B" text-anchor="middle">(2) inverse relationship</text><text x="870" y="358" font-size="17" font-weight="400" fill="#707780" text-anchor="middle">No relationship stated</text><text x="25" y="403" font-size="17" font-weight="700" fill="#20252B" text-anchor="start">PAPER</text><text x="500" y="502" font-size="22" font-weight="700" fill="#20252B" text-anchor="middle">4 distinct metrics · 5 metric mentions · 2 stated interdependencies</text><text x="500" y="539" font-size="19" font-weight="400" fill="#20252B" text-anchor="middle">Power occurs in sentences (1) and (2). Charge is named without an interdependence.</text></svg>