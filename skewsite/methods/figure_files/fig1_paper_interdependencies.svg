<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">The seven-metric electricity example: equation and condition relationships</title><desc id="desc">Panel A shows all fifteen interdependencies among voltage V, current I, resistance R, power P, charge Q and elapsed time t. Nine have a smallest group of three; six have a smallest group of four. Panel B shows temperature T linked to voltage and current by the condition T below 4 kelvin. These two links have no algebraic group size.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17638B"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><text x="25" y="35" font-size="24" font-weight="700" fill="#20252B" text-anchor="start">A. Relationships from equations</text><text x="700" y="35" font-size="22" font-weight="700" fill="#20252B" text-anchor="start">B. A stated condition</text><path d="M665 55V470" fill="none" stroke="#D1D7DD" stroke-width="1.5" stroke-linecap="round"/><path d="M570 120 Q397.5 35 225 120" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><path d="M225 120 Q397.5 490 570 400" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><path d="M570 120 Q397.5 490 225 400" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><path d="M225 400 Q397.5 475 570 400" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><path d="M75 265 Q322.5 25 570 120" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><path d="M75 265 Q322.5 490 570 400" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><path d="M395 265 L225 120" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M225 400 L225 120" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M395 265 L225 400" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M75 265 L225 120" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M395 265 L75 265" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M75 265 L225 400" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M395 265 L570 120" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M395 265 L570 400" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><path d="M570 120 L570 400" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><circle cx="75" cy="265" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="75" y="274" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">P</text><circle cx="225" cy="120" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="225" y="129" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">V</text><circle cx="225" cy="400" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="225" y="409" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">R</text><circle cx="395" cy="265" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="395" y="274" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">I</text><circle cx="570" cy="120" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="570" y="129" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">Q</text><circle cx="570" cy="400" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="570" y="409" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">t</text><text x="835" y="90" font-size="24" font-weight="700" fill="#9C4F00" text-anchor="middle">T &lt; 4 K</text><circle cx="835" cy="150" r="30" fill="white" stroke="#20252B" stroke-width="2"/><text x="835" y="159" font-size="28" font-weight="700" fill="#20252B" text-anchor="middle">T</text><path d="M835 180 L740 300" fill="none" stroke="#9C4F00" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="325" r="27" fill="white" stroke="#20252B" stroke-width="2"/><text x="740" y="334" font-size="27" font-weight="700" fill="#20252B" text-anchor="middle">V</text><path d="M835 180 L930 300" fill="none" stroke="#9C4F00" stroke-width="3" stroke-linecap="round"/><circle cx="930" cy="325" r="27" fill="white" stroke="#20252B" stroke-width="2"/><text x="930" y="334" font-size="27" font-weight="700" fill="#20252B" text-anchor="middle">I</text><text x="835" y="387" font-size="18" font-weight="400" fill="#20252B" text-anchor="middle">The sentence denies V–I dependence.</text><text x="835" y="419" font-size="18" font-weight="400" fill="#20252B" text-anchor="middle">Its condition adds T–V and T–I.</text><text x="835" y="451" font-size="18" font-weight="400" fill="#20252B" text-anchor="middle">No algebraic group size is assigned.</text><text x="25" y="480" font-size="19" font-weight="400" fill="#20252B" text-anchor="start">V: voltage    I: current    R: resistance</text><text x="25" y="510" font-size="19" font-weight="400" fill="#20252B" text-anchor="start">P: power     Q: charge    t: elapsed time</text><text x="700" y="490" font-size="19" font-weight="400" fill="#20252B" text-anchor="start">T: temperature</text><path d="M30 550H105" fill="none" stroke="#17638B" stroke-width="5.3" stroke-linecap="round"/><text x="120" y="557" font-size="20" font-weight="400" fill="#20252B" text-anchor="start">Smallest shared group: 3 metrics</text><path d="M520 550H595" fill="none" stroke="#17638B" stroke-width="2.2" stroke-linecap="round"/><text x="610" y="557" font-size="20" font-weight="400" fill="#20252B" text-anchor="start">Smallest shared group: 4 metrics</text><text x="500" y="607" font-size="22" font-weight="700" fill="#20252B" text-anchor="middle">15 equation-derived pairs + 2 condition-derived pairs = 17 interdependencies</text></svg>